<template>
    <lightning-card title="Account Records">
        <lightning-datatable
            key-field="id"
            data={data}
            columns={column}
            max-row-selection="1"
            onrowselection={rowSelectionHandler}>
        </lightning-datatable>

        <template lwc:if={oppData}>
            <c-top-account-opp-comp opp-name = {selectedAccountName} opp-data = {relatedOppData}></c-top-account-opp-comp>
        </template>
    </lightning-card>
</template>
